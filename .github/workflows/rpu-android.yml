name: RPU Android

on:
  push:
    branches:
      - codex/rpu-android
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rpu-android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  ce-dat:
    uses: ./.github/workflows/reusable-build-ce-dat.yml
    with:
      preset: linux-x64-debug

  android:
    name: Build RPU Android package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: ce-dat
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
          cache: gradle

      - name: Check settings coverage and persistence
        run: |
          python3 os/android/tools/generate_settings_schema.py --check
          bash os/android/tools/test-settings.sh
          bash os/android/tools/test-commands.sh

      - name: Cache development signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: rpu-android-debug-keystore-v1

      - name: Build APK and check SDL bindings
        working-directory: os/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Test Android launcher, settings and command panel
        working-directory: os/android
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Upload Android UI test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-command-panel-tests
          path: |
            os/android/app/build/reports/tests/testDebugUnitTest
            os/android/app/build/reports/hud-preview
            os/android/app/build/reports/launcher-preview
            os/android/app/build/test-results/testDebugUnitTest
          retention-days: 30
          if-no-files-found: warn

      - name: Check HUD keyboard mapping
        run: python3 os/android/tools/check-command-bindings.py

      - name: Download matching engine assets
        uses: actions/download-artifact@v4
        with:
          name: ce-dat
          path: out/dist/fallout2-rpu-ce-android

      - name: Verify application and native libraries
        run: |
          python3 - <<'CHECK'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          import zipfile
          import struct
          import json
          manifest = Path('os/android/app/build/intermediates/merged_manifests/debug/AndroidManifest.xml')
          root = ET.parse(manifest).getroot()
          assert root.attrib['package'] == 'io.github.stenerstrom.fallout2rpuce.debug'
          android = '{http://schemas.android.com/apk/res/android}'
          activities = {a.attrib[android + 'name'] for a in root.findall('./application/activity')}
          assert 'com.alexbatalov.fallout2ce.MainActivity' in activities
          assert 'com.alexbatalov.fallout2ce.ImportActivity' in activities
          for name in ('LauncherActivity', 'SettingsActivity', 'SettingsEditorActivity', 'BundledInstallActivity', 'SaveGamesActivity'):
              assert 'com.alexbatalov.fallout2ce.' + name in activities
          launcher = root.find("./application/activity[@"+android+"name='com.alexbatalov.fallout2ce.LauncherActivity']")
          assert launcher.find("./intent-filter/category[@"+android+"name='android.intent.category.LAUNCHER']") is not None
          game = root.find("./application/activity[@"+android+"name='com.alexbatalov.fallout2ce.MainActivity']")
          assert game.attrib[android + 'process'].endswith(':game')
          with zipfile.ZipFile('os/android/app/build/outputs/apk/debug/app-debug.apk') as apk:
              # Private game data is packaged only by local builds.
              assert not any(name.startswith(('assets/bundled-game/', 'assets/bundled-games/', 'assets/bundled-pool/')) for name in apk.namelist())
              schema = json.loads(apk.read('assets/engine-settings.json'))
              assert sum(len(section['fields']) for section in schema) == 97
              for abi in ('arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'):
                  assert f'lib/{abi}/libfallout2-ce.so' in apk.namelist(), abi
              for entry in apk.infolist():
                  if not entry.filename.endswith('.so'):
                      continue
                  assert entry.compress_type == zipfile.ZIP_DEFLATED, entry.filename
                  if not entry.filename.startswith(('lib/arm64-v8a/', 'lib/x86_64/')):
                      continue
                  elf = apk.read(entry)
                  assert b'Java_com_alexbatalov_fallout2ce_GameCommandHud_nativeSetSpeed' in elf
                  assert b'Java_com_alexbatalov_fallout2ce_GameCommandHud_nativeGetSpeed' in elf
                  assert b'Java_com_alexbatalov_fallout2ce_GameCommandHud_nativeOpenAppearance' not in elf
                  assert elf[:6] == b'\x7fELF\x02\x01', entry.filename
                  phoff = struct.unpack_from('<Q', elf, 32)[0]
                  phsize, phnum = struct.unpack_from('<HH', elf, 54)
                  load_segments = 0
                  for index in range(phnum):
                      kind, flags, offset, vaddr, paddr, filesz, memsz, align = struct.unpack_from('<IIQQQQQQ', elf, phoff + index * phsize)
                      if kind == 1:
                          load_segments += 1
                          assert align >= 16384 and align & (align - 1) == 0, entry.filename
                          assert offset % 16384 == vaddr % 16384, entry.filename
                  assert load_segments > 0, entry.filename
          # AGP applies useLegacyPackaging after the merged-manifest stage.
          # Check compression in the APK above, not an optional intermediate attribute.
          print('Verified app identity, four ABIs, compressed libraries and 16 KB ELF alignment.')
          CHECK

      - name: Package for testing
        env:
          ENGINE_COMMIT: ${{ github.sha }}
          ENGINE_REPOSITORY: ${{ github.repository }}
        run: |
          package=out/dist/fallout2-rpu-ce-android
          cp os/android/app/build/outputs/apk/debug/app-debug.apk "$package/fallout2-rpu-ce-debug.apk"
          cp files/fallout2.cfg "$package/EXAMPLE_fallout2.cfg"
          cp docs/rpu-android-install.md "$package/README.md"
          python3 - <<'INFO'
          import json
          import os
          from pathlib import Path
          info = {
              'engine_repository': os.environ['ENGINE_REPOSITORY'],
              'engine_commit': os.environ['ENGINE_COMMIT'],
              'build_type': 'Debug',
              'application_id': 'io.github.stenerstrom.fallout2rpuce.debug',
              'rpu_bundled': False,
              'rpu_target_reference': {
                  'repository': 'BGforgeNet/Fallout2_Restoration_Project',
                  'tag': 'v2.4.34',
                  'commit': '6cd291f64a48782ed45fe116e5fb453ecbfc5488',
              },
              'rpu_source_reference': {
                  'repository': 'stenerstrom/Fallout2_Restoration_Project',
                  'commit': 'c14d687e4c401f64f7ef4ee255de95f07a91a6e5',
              },
          }
          Path('out/dist/fallout2-rpu-ce-android/BUILD_INFO.json').write_text(json.dumps(info, indent=2) + '\n')
          INFO
          cd "$package"
          sha256sum fallout2-rpu-ce-debug.apk ce.dat EXAMPLE_fallout2.cfg README.md BUILD_INFO.json > SHA256SUMS

      - name: Upload installable test package
        uses: actions/upload-artifact@v4
        with:
          name: fallout2-rpu-ce-android-${{ github.run_number }}
          path: out/dist/fallout2-rpu-ce-android/
          if-no-files-found: error
          retention-days: 30
